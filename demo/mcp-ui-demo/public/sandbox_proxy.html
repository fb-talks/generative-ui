<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Sandbox Proxy</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <script>
    // EXPERIMENT: minimal sandbox proxy straight from the mcpui.dev
    // walkthrough (guide/client/walkthrough#_3-set-up-a-sandbox-proxy).
    // document.write() replaces this document with the widget, so this
    // proxy can render ONE widget per iframe instance: the host must
    // remount the AppRenderer (fresh proxy iframe) for every tool call.
    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || typeof data !== "object") return;

      if (data.method === "ui/notifications/sandbox-resource-ready") {
        const { html } = data.params || {};
        if (html) {
          document.open();
          document.write(html);
          document.close();
        }
      }
    });

    // Signal that the sandbox proxy is ready
    window.parent.postMessage(
      {
        method: "ui/notifications/sandbox-proxy-ready",
        params: {},
      },
      "*",
    );
  </script>
</body>

</html>
