<style>
  html,
  body {
    margin: 0;
    height: 100%;
  }

  .bl-root {
    box-sizing: border-box;
    height: 100%;
    overflow-y: auto;
    padding: 12px;
    font-family: system-ui, -apple-system, sans-serif;
    color: #1a1a1a;
    background: #fff;
  }

  .bl-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 10px;
  }

  .bl-count {
    font-weight: 600;
    font-size: 15px;
  }

  .bl-sub {
    color: #666;
    font-size: 13px;
  }

  .bl-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
  }

  .bl-card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }

  .bl-card:hover {
    border-color: #007bff;
    box-shadow: 0 1px 6px rgba(0, 0, 0, .10);
  }

  .bl-card.is-selected {
    border-color: #007bff;
    background: #f2f8ff;
    box-shadow: 0 0 0 2px rgba(0, 123, 255, .25);
  }

  .bl-addr {
    font-weight: 600;
    font-size: 14px;
  }

  .bl-city {
    color: #666;
    font-size: 12px;
    margin-bottom: 6px;
  }

  .bl-price {
    color: #007bff;
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 6px;
  }

  .bl-specs {
    color: #444;
    font-size: 12px;
    margin-bottom: 6px;
  }

  .bl-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .bl-tag {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 10px;
    background: #eef1f4;
    color: #444;
  }

  .bl-tag.is-new {
    background: #e3f5e8;
    color: #1d7a3a;
  }

  .bl-empty {
    color: #666;
    font-size: 14px;
  }
</style>

<div class="bl-root" id="bl-root">
  <div class="bl-empty">Caricamento immobili…</div>
</div>

<script type="module">
  // Native MCP Apps protocol: the App class does the ui/initialize handshake
  // and exposes typed helpers (sendMessage, sendSizeChanged, ...).
  import { App } from "http://localhost:3010/ext-apps.js";

  // autoResize (on by default) would grow the container to fit the whole
  // list; this widget wants a fixed 560x420 box with its own scrollbar.
  const app = new App({ name: "buildings-widget", version: "1.0.0" }, {}, { autoResize: false });

  const TYPE_LABEL = {
    apartment: "Appartamento",
    house: "Casa",
    commercial: "Commerciale",
  };

  const eur = new Intl.NumberFormat("it-IT", {
    style: "currency",
    currency: "EUR",
    maximumFractionDigits: 0,
  });

  const esc = (s) =>
    String(s).replace(/[&<>"]/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]),
    );

  function card(b) {
    const tags = [
      `<span class="bl-tag">${esc(TYPE_LABEL[b.type] || b.type)}</span>`,
      `<span class="bl-tag${b.condition === "new" ? " is-new" : ""}">${b.condition === "new" ? "Nuovo" : "Usato"
      }</span>`,
    ];
    if (b.balcony) tags.push('<span class="bl-tag">Balcone</span>');
    if (b.garden) tags.push('<span class="bl-tag">Giardino</span>');

    return `
      <div class="bl-card" data-id="${b.id}">
        <div class="bl-addr">${esc(b.address)}</div>
        <div class="bl-city">${esc(b.city)}</div>
        <div class="bl-price">${eur.format(b.price)}</div>
        <div class="bl-specs">${b.mq} m² · ${b.rooms} locali · ${b.bathrooms
      } bagni</div>
        <div class="bl-tags">${tags.join("")}</div>
      </div>`;
  }

  let buildings = [];

  function render(list, filters) {
    buildings = list;
    const root = document.getElementById("bl-root");

    if (!list.length) {
      root.innerHTML =
        '<div class="bl-empty">Nessun immobile trovato con questi criteri.</div>';
      return;
    }

    const active = Object.entries(filters || {})
      .filter(([, v]) => v !== undefined && v !== null && v !== "")
      .map(([k, v]) => `${k}: ${v}`)
      .join(" · ");

    root.innerHTML = `
      <div class="bl-head">
        <span class="bl-count">${list.length} immobil${list.length === 1 ? "e" : "i"
      }</span>
        ${active ? `<span class="bl-sub">${esc(active)}</span>` : ""}
      </div>
      <div class="bl-grid">${list.map(card).join("")}</div>`;
  }

  // Clicking a property tells the host which one was picked
  document.getElementById("bl-root").addEventListener("click", (e) => {
    const el = e.target.closest(".bl-card");
    if (!el) return;
    const b = buildings.find((x) => String(x.id) === el.dataset.id);
    if (!b) return;

    document
      .querySelectorAll(".bl-card.is-selected")
      .forEach((c) => c.classList.remove("is-selected"));
    el.classList.add("is-selected");

    app.sendMessage({
      role: "user",
      content: [
        {
          type: "text",
          text: `Immobile selezionato: ${b.address}, ${b.city} — ${b.mq} m², ${b.rooms} locali, ${b.price} EUR`,
        },
      ],
    });
  });

  // The host delivers the tool data as two notifications: the filters the
  // model chose (ui/notifications/tool-input) and the tool result
  // (ui/notifications/tool-result).
  let lastFilters = null;
  app.ontoolinput = ({ arguments: args }) => {
    lastFilters = args || null;
  };
  app.ontoolresult = (result) => {
    const structured = result?.structuredContent;

    if (result?.isError) {
      document.getElementById("bl-root").innerHTML =
        '<div class="bl-empty">Errore nel recupero degli immobili.</div>';
      return;
    }
    if (!structured || !Array.isArray(structured.buildings)) return;

    render(structured.buildings, lastFilters);
  };

  // Handshake ui/initialize (callbacks are registered above), then ask the
  // host for a comfortable size (a list needs more room than the color picker)
  await app.connect();
  app.sendSizeChanged({ width: 560, height: 420 });
</script>
